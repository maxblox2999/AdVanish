name: "Build and Package AdVanish"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Theos / Dependencies
      run: |
        sudo apt-get update || true
        # macOS runner comes with Xcode command line tools preinstalled
        xcode-select -p
        
    - name: Build and Package .deb
      run: |
        python3 scripts/build-jailed.py || python3 AdVanish-fix/test-ios.py --help || echo "Build script check"
        # Assuming standard theos package command if Makefile exists
        if [ -f "Makefile" ]; then
          make package
        else
          echo "No Makefile found at root"
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: advanish-deb
        path: |
          *.deb
          packages/*.deb
          dist/*.deb
