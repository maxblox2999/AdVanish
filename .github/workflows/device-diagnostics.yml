name: Subway device diagnostics

on:
  push:
    branches: [diagnostics/subway-device]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subway-device-diagnostics
  cancel-in-progress: true

defaults:
  run:
    working-directory: project

jobs:
  rootless:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build rootless diagnostics
        env:
          AVN_DEVICE_DIAGNOSTICS: '1'
        run: |
          set -euo pipefail
          brew install ldid dpkg make
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          bash scripts/setup-theos.sh "$RUNNER_TEMP/advanish-tools" rootless
          export THEOS="$RUNNER_TEMP/advanish-tools/theos"
          bash scripts/build.sh rootless
          printf 'device_diagnostics=SubwaySurfers\n' >> dist/rootless/build-info.txt
          (cd dist/rootless && shasum -a 256 ./*.deb package-check.json build-info.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: subway-device-diagnostics
          path: project/dist/rootless/
          if-no-files-found: error
          retention-days: 7
