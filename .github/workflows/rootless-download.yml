name: Rootless test download
on:
  push:
    paths: ['.github/workflows/rootless-download.yml']
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 41342546849
          name: advanish-rootless-b5a874870cc8f7231b8eaab13ecc7e34403c8e4d
          path: package
      - name: Check successful rootless tests and publish deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("package")
          sha = "b5a874870cc8f7231b8eaab13ecc7e34403c8e4d"
          for name, minimum in [("ios-settings.json", 16), ("ios-simulator.json", 71)]:
              report = json.loads((p / name).read_text())
              assert report["passed"] and report["source_commit"] == sha
              assert len(report["checks"]) >= minimum
          debs = list(p.glob("*.deb"))
          assert len(debs) == 1
          checksums = dict((line.split(None, 1)[1].strip().removeprefix("./"), line.split()[0]) for line in (p / "SHA256SUMS").read_text().splitlines())
          assert hashlib.sha256(debs[0].read_bytes()).hexdigest() == checksums[debs[0].name]
          debs[0].rename("AdVanish-0.5.2-rootless.deb")
          PY
          printf '%s\n' 'Rootless test package. Production Settings and 71 native simulator checks passed on iOS 18.6. Physical iPhone behavior and real game rewards remain unverified. This is not the complete multi-variant release.' > notes.md
          gh release create v0.5.2-rootless-test AdVanish-0.5.2-rootless.deb --repo "$GITHUB_REPOSITORY" --target b5a874870cc8f7231b8eaab13ecc7e34403c8e4d --title "AdVanish 0.5.2 rootless test" --notes-file notes.md --prerelease
          gh release view v0.5.2-rootless-test --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].url'
