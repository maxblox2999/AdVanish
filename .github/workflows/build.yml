name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS build runner
        type: choice
        required: false
        default: macos-15
        options:
          - macos-15
          - macos-15-intel

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: project

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject CRLF in tracked text files
        working-directory: .
        run: |
          python3 -c 'import pathlib, subprocess, sys; suffixes = {".m", ".mm", ".h", ".xm", ".plist", ".yml", ".md", ".py", ".sh", ".cjs", ".js", ".json", ".env"}; names = {"control", "Makefile", "LICENSE", "NOTICE.md"}; files = [n for n in subprocess.check_output(["git", "ls-files", "-z"], text=True).split("\0") if n and (pathlib.Path(n).suffix in suffixes or n in names)]; bad = [n for n in files if b"\r" in pathlib.Path(n).read_bytes()]; print("\n".join(bad)); sys.exit(1 if bad else 0)'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test web engine and check generated source
        run: |
          node scripts/embed-web.cjs
          node --test tests/web.test.cjs
          git diff --exit-code -- AdSpeedWebScript.h
          bash -n scripts/setup-theos.sh scripts/build.sh
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test Chromium media and playable paths
        env:
          BROWSER_PATH: /usr/bin/google-chrome
        run: node tests/browser/verify.cjs
      - name: Archive complete source
        run: |
          mkdir -p dist/source "$RUNNER_TEMP/source-id"
          git -C .. archive --format=tar --prefix=AdVanish/ HEAD > "$RUNNER_TEMP/advanish-source.tar"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/source-id/SOURCE_COMMIT"
          tar --append --file="$RUNNER_TEMP/advanish-source.tar" --transform='s,^,AdVanish/,' -C "$RUNNER_TEMP/source-id" SOURCE_COMMIT
          gzip -n < "$RUNNER_TEMP/advanish-source.tar" > dist/source/AdVanish-source.tar.gz
          cp dist/browser.json dist/source/browser.json
          cd dist/source
          sha256sum AdVanish-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: advanish-source-${{ github.sha }}
          path: project/dist/source/
          if-no-files-found: error
          overwrite: true

  package:
    timeout-minutes: 15
    runs-on: ${{ inputs.runner || 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        variant: [rootless, rootful, roothide, jailed]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build package and prepare simulator
        id: package_build
        run: |
          set -euo pipefail
          prepare=
          case "${{ matrix.variant }}" in
            rootless|jailed)
              python3 scripts/test-ios.py --prepare "AdVanish-${{ matrix.variant }}-${{ github.run_id }}" \
                > "$RUNNER_TEMP/advanish-udid" &
              prepare=$!
              ;;
          esac
          brew install ldid dpkg make
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          bash scripts/setup-theos.sh "$RUNNER_TEMP/advanish-tools" "${{ matrix.variant }}"
          export THEOS="$RUNNER_TEMP/advanish-tools/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          bash scripts/build.sh "${{ matrix.variant }}"
          if [ -n "$prepare" ]; then
            wait "$prepare"
            echo "SIM_UDID=$(cat "$RUNNER_TEMP/advanish-udid")" >> "$GITHUB_ENV"
          fi
      - name: Build injected framework
        if: matrix.variant == 'jailed'
        run: python3 scripts/build-jailed.py --simulator --output "$RUNNER_TEMP/advanish-framework"
      - name: Open production Settings pages in iOS Simulator
        if: matrix.variant == 'rootless'
        run: python3 scripts/test-ios.py --video tests/ios/fixture.mp4 --settings --device "$SIM_UDID" --output dist/rootless/ios-settings.json
      - name: Exercise native skipping and pending reward protection in iOS Simulator
        if: matrix.variant == 'rootless'
        run: python3 scripts/test-ios.py --video tests/ios/fixture.mp4 --device "$SIM_UDID" --output dist/rootless/ios-simulator.json
      - name: Exercise injected initialization and production hooks in iOS Simulator
        if: matrix.variant == 'jailed'
        run: python3 scripts/test-ios.py --video tests/ios/fixture.mp4 --injected --framework "$RUNNER_TEMP/advanish-framework" --device "$SIM_UDID" --output dist/jailed/ios-injected.json
      - name: Verify manual-only injected mode stays idle until a button request
        if: ${{ !cancelled() && matrix.variant == 'jailed' && steps.package_build.outcome == 'success' }}
        run: python3 scripts/test-ios.py --video tests/ios/fixture.mp4 --injected --manual --framework "$RUNNER_TEMP/advanish-framework" --device "$SIM_UDID" --output dist/jailed/ios-injected-manual.json
      - name: Delete simulator
        if: always() && (matrix.variant == 'rootless' || matrix.variant == 'jailed')
        run: |
          if [ -n "${SIM_UDID:-}" ]; then python3 scripts/test-ios.py --delete "$SIM_UDID"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: advanish-${{ matrix.variant }}-${{ github.sha }}
          path: project/dist/${{ matrix.variant }}/
          if-no-files-found: error
          overwrite: true

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: advanish-*-${{ github.sha }}
          path: incoming
      - name: Require Main guard success for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          guard=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/guard.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=10" --jq '.workflow_runs[0].conclusion')
          test "$guard" = success || { echo "Main guard has not passed for this commit: $guard"; exit 1; }
      - name: Validate release artifacts and full source
        run: python3 project/scripts/prepare-release.py
      - name: Publish test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$GITHUB_SHA" || { echo "A newer commit supersedes this build."; exit 1; }
          tag="v$(awk '/^Version:/ {print $2}' project/control)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace its assets."
            exit 1
          fi
          version="${tag#v}"
          tail -n +2 project/RELEASE_NOTES.md > release-notes.md
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AdVanish $version" --notes-file release-notes.md --prerelease --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Verify public downloads
        run: python3 project/scripts/verify-release.py
      - name: Remove superseded releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in v0.2.0 v0.2.1 v0.3.0 v0.3.1 v0.5.0 v0.5.1; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
