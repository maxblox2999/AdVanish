name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: macOS build runner
        type: choice
        required: false
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
      runner_fallback:
        description: Internal runner retry (prevents retry loops)
        type: boolean
        default: false
      source_commit:
        description: Expected commit for a runner retry
        type: string
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.runner_fallback == true }}

permissions:
  contents: read

defaults:
  run:
    working-directory: project

jobs:
  runner_fallback:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 92
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Retry an idle macOS queue on Intel once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/runner-fallback.py

  checks:
    name: checks
    timeout-minutes: 30
    runs-on: ${{ inputs.runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify runner retry commit
        if: inputs.runner_fallback
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
          RETRY_RUNNER: ${{ inputs.runner }}
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$RETRY_RUNNER" = macos-15-intel
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reject CRLF in tracked text files
        working-directory: .
        run: |
          python3 -c 'import pathlib, subprocess, sys; suffixes = {".m", ".mm", ".h", ".xm", ".plist", ".yml", ".md", ".py", ".sh", ".cjs", ".js", ".json", ".env"}; names = {"control", "Makefile", "LICENSE", "NOTICE.md"}; files = [n for n in subprocess.check_output(["git", "ls-files", "-z"], text=True).split("\0") if n and (pathlib.Path(n).suffix in suffixes or n in names)]; bad = [n for n in files if b"\r" in pathlib.Path(n).read_bytes()]; print("\n".join(bad)); sys.exit(1 if bad else 0)'
      - name: Test web engine and tools
        run: |
          node scripts/embed-web.cjs
          node --test tests/web.test.cjs
          git diff --exit-code -- AdSpeedWebScript.h
          bash -n scripts/setup-theos.sh scripts/build.sh
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test Chromium media and playable paths
        env:
          BROWSER_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: node tests/browser/verify.cjs
      - name: Build simulator framework before booting the device
        run: |
          set -euo pipefail
          bash scripts/setup-theos.sh "$RUNNER_TEMP/advanish-tools" jailed
          export THEOS="$RUNNER_TEMP/advanish-tools/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          python3 scripts/build-jailed.py --simulator --output "$RUNNER_TEMP/advanish-framework"
      - name: Prepare shared simulator
        run: |
          set -euo pipefail
          python3 scripts/test-ios.py --prepare "AdVanish-checks-${{ github.run_id }}" > "$RUNNER_TEMP/advanish-udid"
          echo "SIM_UDID=$(cat "$RUNNER_TEMP/advanish-udid")" >> "$GITHUB_ENV"
      - name: Check production Settings
        run: python3 scripts/test-ios.py --video tests/ios/fixture.mp4 --device "$SIM_UDID" --settings --output dist/ios/ios-settings.json
      - name: Check native playback and pending rewards
        run: python3 scripts/test-ios.py --video tests/ios/fixture.mp4 --device "$SIM_UDID" --output dist/ios/ios-simulator.json
      - name: Check injected initialization and hooks
        run: python3 scripts/test-ios.py --video tests/ios/fixture.mp4 --device "$SIM_UDID" --injected --framework "$RUNNER_TEMP/advanish-framework" --output dist/ios/ios-injected.json
      - name: Check manual mode
        run: python3 scripts/test-ios.py --video tests/ios/fixture.mp4 --device "$SIM_UDID" --injected --manual --framework "$RUNNER_TEMP/advanish-framework" --output dist/ios/ios-injected-manual.json
      - name: Delete simulator
        if: always()
        run: |
          device="${SIM_UDID:-$(cat "$RUNNER_TEMP/advanish-udid" 2>/dev/null || true)}"
          if [ -n "$device" ]; then python3 scripts/test-ios.py --delete "$device"; fi
      - name: Archive complete source
        run: python3 scripts/archive-source.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: advanish-source-${{ github.sha }}
          path: project/dist/source/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && (hashFiles('project/dist/ios/ios-settings.json') != '' || hashFiles('project/dist/ios/ios-settings-diagnostics.json') != '') }}
        with:
          name: advanish-ios-settings-${{ github.sha }}
          path: |
            project/dist/ios/ios-settings.json
            project/dist/ios/ios-settings-diagnostics.json
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && (hashFiles('project/dist/ios/ios-simulator.json') != '' || hashFiles('project/dist/ios/ios-simulator-diagnostics.json') != '') }}
        with:
          name: advanish-ios-native-${{ github.sha }}
          path: |
            project/dist/ios/ios-simulator.json
            project/dist/ios/ios-simulator-diagnostics.json
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && (hashFiles('project/dist/ios/ios-injected.json') != '' || hashFiles('project/dist/ios/ios-injected-diagnostics.json') != '') }}
        with:
          name: advanish-ios-injected-${{ github.sha }}
          path: |
            project/dist/ios/ios-injected.json
            project/dist/ios/ios-injected-diagnostics.json
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && (hashFiles('project/dist/ios/ios-injected-manual.json') != '' || hashFiles('project/dist/ios/ios-injected-manual-diagnostics.json') != '') }}
        with:
          name: advanish-ios-manual-${{ github.sha }}
          path: |
            project/dist/ios/ios-injected-manual.json
            project/dist/ios/ios-injected-manual-diagnostics.json
          if-no-files-found: error
          overwrite: true

  rootless:
    name: package (rootless)
    needs: [checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    uses: ./.github/workflows/package.yml
    with:
      variant: rootless
      runner: ${{ inputs.runner || 'macos-15' }}

  jailed:
    name: package (jailed)
    needs: [checks, rootless]
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    uses: ./.github/workflows/package.yml
    with:
      variant: jailed
      runner: ${{ inputs.runner || 'macos-15' }}

  rootful:
    name: package (rootful)
    needs: [checks, jailed]
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    uses: ./.github/workflows/package.yml
    with:
      variant: rootful
      runner: ${{ inputs.runner || 'macos-15' }}

  roothide:
    name: package (roothide)
    needs: [checks, rootful]
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    uses: ./.github/workflows/package.yml
    with:
      variant: roothide
      runner: ${{ inputs.runner || 'macos-15' }}

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [checks, rootless, jailed, rootful, roothide]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check published version
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(awk '/^Version:/ {print $2}' project/control)"
          tags=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if printf '%s\n' "$tags" | grep -Fxq "$tag"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already published; its downloads are unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.published.outputs.exists != 'true'
        with:
          pattern: advanish-*-${{ github.sha }}
          path: incoming
      - name: Require Main guard success for this commit
        if: steps.published.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          guard=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/guard.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=10" --jq '.workflow_runs[0].conclusion')
          test "$guard" = success || { echo "Main guard has not passed for this commit: $guard"; exit 1; }
      - name: Validate release artifacts and full source
        if: steps.published.outputs.exists != 'true'
        run: python3 project/scripts/prepare-release.py
      - name: Publish test build
        if: steps.published.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$GITHUB_SHA" || { echo "A newer commit supersedes this build."; exit 1; }
          tag="v$(awk '/^Version:/ {print $2}' project/control)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace its assets."
            exit 1
          fi
          version="${tag#v}"
          tail -n +2 project/RELEASE_NOTES.md > release-notes.md
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AdVanish $version" --notes-file release-notes.md --prerelease --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Verify public downloads
        if: steps.published.outputs.exists != 'true'
        run: python3 project/scripts/verify-release.py
      - name: Remove superseded releases
        if: steps.published.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in v0.2.0 v0.2.1 v0.3.0 v0.3.1 v0.5.0 v0.5.1; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
